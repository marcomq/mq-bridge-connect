[package]
name = "mq-bridge-redpanda"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false
description = "Redpanda Connect compatibility plugin for mq-bridge"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["rlib", "cdylib"]
doctest = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
libc = "0.2"
libloading = "0.9"
mq-bridge = { path = "../mq-bridge", default-features = false }
serde_json = "1.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[features]
default = ["plugin"]
plugin = ["mq-bridge/plugin-sdk"]
