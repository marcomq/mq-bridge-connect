[package]
name = "mq-bridge-connect"
version = "0.1.1"
edition = "2021"
rust-version = "1.85"
description = "Unofficial Redpanda Connect compatibility plugin for mq-bridge"
license = "MIT OR Apache-2.0"
repository = "https://github.com/marcomq/mq-bridge-connect"
exclude = [".github/", "node/", "python/", "packaging/"]

[lib]
crate-type = ["rlib", "cdylib"]
doctest = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
bytes = "1"
libc = "0.2"
libloading = "0.9"
mq-bridge = { version = "0.4.13", default-features = false }
serde_json = "1.0"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_LibraryLoader"] }

[build-dependencies]
flate2 = { version = "1.1", optional = true }
sha2 = { version = "0.11", optional = true }
tar = { version = "0.4", optional = true }
ureq = { version = "3", optional = true }

[features]
default = ["plugin", "download"]
plugin = ["mq-bridge/plugin-sdk"]
# Fetch the prebuilt Go library in a crates.io build; see build.rs.
download = ["dep:flate2", "dep:sha2", "dep:tar", "dep:ureq"]
