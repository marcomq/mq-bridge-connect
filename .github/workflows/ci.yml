name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  go:
    name: Go (vet, race)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go-bridge/go.mod
          cache-dependency-path: go-bridge/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l go-bridge/)
          if [ -n "$unformatted" ]; then
            echo "not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
      - name: go vet
        working-directory: go-bridge
        run: go vet ./...
      # components.allow is a claim; this reads the closure the compiler sees
      # and fails if an upstream release taints a package that was clean.
      - name: No RCL source is linked
        run: python3 scripts/check-rcl.py
      # The sink parks source batches across goroutines, so the race detector is
      # the test that matters most here.
      - name: go test -race
        working-directory: go-bridge
        run: go test -race ./...

  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          path: mq-bridge-connect
      - uses: actions/setup-go@v7
        with:
          go-version-file: mq-bridge-connect/go-bridge/go.mod
          cache-dependency-path: mq-bridge-connect/go-bridge/go.sum
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mq-bridge-connect
      - name: Formatting and lints
        working-directory: mq-bridge-connect
        run: |
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      # The `go` job runs this on Linux. The linked file set is constrained per
      # platform, so the macOS closure is a different scan and needs its own.
      - name: No RCL source is linked (macOS closure)
        if: matrix.os == 'macos-latest'
        working-directory: mq-bridge-connect
        run: python3 scripts/check-rcl.py
      # The notices are generated from what is actually linked, so a go.sum
      # bump, a components.allow edit or a Cargo.lock change can add a module,
      # or a licence, while the committed file still describes the previous
      # build. A diff gate rather than a regenerate-and-commit step: the point
      # is that a human reads a new licence before it ships. The generator pins
      # GOOS, GOARCH and the Rust targets, so one runner covers every platform.
      - name: THIRD_PARTY_NOTICES is current
        if: matrix.os == 'ubuntu-latest'
        working-directory: mq-bridge-connect
        run: |
          python3 scripts/gen-third-party-notices.py
          git diff --exit-code THIRD_PARTY_NOTICES

      # Builds the Go c-shared sibling and the Rust cdylib, runs every test, then
      # the loader smoke test three times.
      - name: Build, test and smoke
        working-directory: mq-bridge-connect
        run: sh scripts/phase0-smoke.sh

  conformance:
    name: Conformance (beanstalkd, NATS, Redis, RabbitMQ, MQTT)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    services:
      beanstalkd:
        # Pinned by digest: the image publishes only `latest`, so a tag would
        # let the acceptance gate change underneath us without a commit.
        image: schickling/beanstalkd@sha256:19a928e3563973219e44f6c29df2a71103c7db894692ae94b7d0760837877e73
        ports:
          - 11300:11300
    steps:
      - uses: actions/checkout@v7
        with:
          path: mq-bridge-connect
      - name: Check out the mq-bridge host
        uses: actions/checkout@v7
        with:
          repository: marcomq/mq-bridge
          path: mq-bridge
      - uses: actions/setup-go@v7
        with:
          go-version-file: mq-bridge-connect/go-bridge/go.mod
          cache-dependency-path: mq-bridge-connect/go-bridge/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mq-bridge-connect
      - name: Wait for beanstalkd
        run: |
          for _ in $(seq 1 30); do
            if (exec 3<>/dev/tcp/127.0.0.1/11300) 2>/dev/null; then exit 0; fi
            sleep 1
          done
          echo "beanstalkd never accepted a connection" >&2
          exit 1
      # Reused from the host repository rather than duplicated here, so the
      # broker versions stay in step with the ones mq-bridge itself tests
      # against. `--wait` blocks until each compose healthcheck passes.
      # beanstalkd stays a service container: mq-bridge has no compose file for
      # it, and the image publishes only `latest`, so it is pinned by digest.
      - name: Start NATS, Redis, RabbitMQ and Mosquitto
        run: |
          for broker in nats redis amqp mqtt; do
            docker compose -f "mq-bridge/tests/integration/docker-compose/$broker.yml" up -d --wait
          done
      - name: Build the Go sibling
        working-directory: mq-bridge-connect/go-bridge
        run: |
          mkdir -p ../target/debug
          go build -buildmode=c-shared -o ../target/debug/libmq_bridge_connect_go.so .
      # The acceptance gate, across six transports: work queues that redeliver
      # and one that cannot, a persistent stream, a routed queue, a consumer
      # group and a QoS 1 topic. Each test asserts the exact set of checks its
      # transport supports, so a check that stops applying fails rather than
      # vanishing.
      - name: Run the conformance suite
        working-directory: mq-bridge-connect
        env:
          MQ_BRIDGE_CONNECT_BEANSTALKD: 127.0.0.1:11300
          MQ_BRIDGE_CONNECT_NATS: 127.0.0.1:4222
          MQ_BRIDGE_CONNECT_REDIS: 127.0.0.1:6379
          MQ_BRIDGE_CONNECT_AMQP: 127.0.0.1:5672
          MQ_BRIDGE_CONNECT_MQTT: 127.0.0.1:1883
        # Serially: `redis_list` and `redis_streams` share a broker, and the
        # suite's checks assume nothing else is draining the transport.
        run: cargo test --locked --test conformance -- --nocapture --test-threads 1
