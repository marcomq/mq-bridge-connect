name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to build an unpublished archive for (e.g. v0.1.0)
        required: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # A release archive is a distribution, which is what the licence obligations
  # attach to. Regenerating the notices here and failing on a diff means a
  # release cannot ship a file that describes a previous build.
  notices:
    name: Notices are current
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          path: mq-bridge-connect
      - uses: actions/setup-go@v7
        with:
          go-version-file: mq-bridge-connect/go-bridge/go.mod
          cache-dependency-path: mq-bridge-connect/go-bridge/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - name: No RCL source is linked
        working-directory: mq-bridge-connect
        run: python3 scripts/check-rcl.py
      - name: THIRD_PARTY_NOTICES is current
        working-directory: mq-bridge-connect
        run: |
          python3 scripts/gen-third-party-notices.py
          git diff --exit-code THIRD_PARTY_NOTICES

  verify-version:
    name: Package versions match the tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Match package versions to tag
        env:
          RELEASE_TAG: ${{ inputs.version || github.ref_name }}
        run: |
          python scripts/set_version.py --check
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          actual = tomllib.loads(Path("Cargo.toml").read_text())["package"]["version"]
          if actual != expected:
              raise SystemExit(f"tag version {expected!r} does not match Cargo.toml {actual!r}")
          print(f"releasing {expected}")
          PY

  archive:
    name: Archive (${{ matrix.target }})
    needs: [notices, verify-version]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        # The Windows leg runs the same staging and packing scripts as the
        # others; only the library file names differ, and those come from the
        # matrix. Intel macOS is deliberately not built.
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            wheel_tag: linux_x86_64
            rust_library: libmq_bridge_connect.so
            go_library: libmq_bridge_connect_go.so
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            wheel_tag: linux_aarch64
            rust_library: libmq_bridge_connect.so
            go_library: libmq_bridge_connect_go.so
          - os: macos-latest
            target: aarch64-apple-darwin
            wheel_tag: macosx_11_0_arm64
            rust_library: libmq_bridge_connect.dylib
            go_library: libmq_bridge_connect_go.dylib
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            wheel_tag: win_amd64
            rust_library: mq_bridge_connect.dll
            go_library: mq_bridge_connect_go.dll
    steps:
      - uses: actions/checkout@v7
        with:
          path: mq-bridge-connect
      - uses: actions/setup-go@v7
        with:
          go-version-file: mq-bridge-connect/go-bridge/go.mod
          cache-dependency-path: mq-bridge-connect/go-bridge/go.sum
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: mq-bridge-connect

      - name: Build both libraries
        working-directory: mq-bridge-connect
        env:
          CGO_ENABLED: "1"
        run: |
          mkdir -p target/release
          (cd go-bridge && go build -buildmode=c-shared -trimpath -ldflags="-s -w" \
              -o ../target/release/${{ matrix.go_library }} .)
          cargo build --locked --release --lib

      # The two libraries and the notices travel as one unit. Anything that
      # separates them turns a compliant build into a non-compliant
      # distribution, so they are staged together and verified below.
      - name: Stage the archive
        working-directory: mq-bridge-connect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME}"
          fi
          name="mq-bridge-connect-${version#v}-${{ matrix.target }}"
          echo "ARCHIVE_NAME=${name}" >> "$GITHUB_ENV"
          mkdir -p "stage/${name}"
          cp "target/release/${{ matrix.rust_library }}" "stage/${name}/"
          cp "target/release/${{ matrix.go_library }}" "stage/${name}/"
          cp THIRD_PARTY_NOTICES LICENSE-MIT LICENSE-APACHE "stage/${name}/"
          cp packaging/INSTALL.md "stage/${name}/"

      # A release that drops the notices is the failure mode this whole effort
      # is about, so it fails the build rather than being caught after upload.
      - name: The archive carries its notices
        working-directory: mq-bridge-connect
        run: |
          missing=0
          for required in \
              "${{ matrix.rust_library }}" \
              "${{ matrix.go_library }}" \
              THIRD_PARTY_NOTICES LICENSE-MIT LICENSE-APACHE INSTALL.md; do
            if [ ! -s "stage/${ARCHIVE_NAME}/${required}" ]; then
              echo "release archive is missing ${required}" >&2
              missing=1
            fi
          done
          exit "$missing"

      - name: Pack
        working-directory: mq-bridge-connect/stage
        run: |
          tar czf "${ARCHIVE_NAME}.tar.gz" "${ARCHIVE_NAME}"
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-${{ matrix.target }}
          path: |
            mq-bridge-connect/stage/${{ env.ARCHIVE_NAME }}.tar.gz
            mq-bridge-connect/stage/${{ env.ARCHIVE_NAME }}.tar.gz.sha256

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # The wheel carries the same two libraries in the package directory,
      # where the plugin finds its Go sibling, and the notices as licence files.
      - name: Build the Python wheel
        working-directory: mq-bridge-connect
        run: |
          cp "target/release/${{ matrix.rust_library }}" "target/release/${{ matrix.go_library }}" \
            python/mq_bridge_connect/
          cp THIRD_PARTY_NOTICES LICENSE-MIT LICENSE-APACHE python/
          python -m pip install build "wheel>=0.45"
          python -m build --wheel --outdir python/dist python
          python -m wheel tags --platform-tag "${{ matrix.wheel_tag }}" --remove python/dist/*.whl

      - name: Repair the Linux wheel
        if: runner.os == 'Linux'
        working-directory: mq-bridge-connect
        run: |
          python -m pip install auditwheel patchelf
          python -m auditwheel repair python/dist/*.whl --wheel-dir python/repaired
          rm python/dist/*.whl
          mv python/repaired/*.whl python/dist/

      - name: The wheel carries its notices
        working-directory: mq-bridge-connect
        env:
          REQUIRED: >-
            mq_bridge_connect/${{ matrix.rust_library }}
            mq_bridge_connect/${{ matrix.go_library }}
            licenses/THIRD_PARTY_NOTICES
        run: |
          python - python/dist/*.whl <<'PY'
          import os
          import sys
          import zipfile

          names = zipfile.ZipFile(sys.argv[1]).namelist()
          missing = [r for r in os.environ["REQUIRED"].split() if not any(n.endswith(r) for n in names)]
          if missing:
              raise SystemExit(f"{sys.argv[1]} is missing {missing}")
          print(f"{sys.argv[1]}: ok")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: python-${{ matrix.target }}
          path: mq-bridge-connect/python/dist/*.whl
          if-no-files-found: error

  publish-pypi:
    name: Publish Python wheels
    needs: archive
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: python-*
          path: dist
          merge-multiple: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validate wheels
        run: |
          python -m pip install twine
          ls -l dist/
          twine check dist/*
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  publish:
    name: Publish the GitHub release
    needs: archive
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
          body: |
            Each archive contains both libraries, `THIRD_PARTY_NOTICES`,
            `LICENSE-MIT`, `LICENSE-APACHE` and `INSTALL.md`. The notices file
            is self-contained: it carries the full text of every licence linked
            into these binaries, and the source locations for the MPL-2.0
            modules. Keep the whole directory together when you deploy it.

  # render.sh hashes the published release assets, so this runs after publish.
  # HOMEBREW_TAP_DEPLOY_KEY is the same write-enabled deploy key mq-bridge uses.
  update-homebrew-tap:
    name: Update Homebrew tap
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Render formula from release assets
        run: packaging/homebrew/render.sh "${GITHUB_REF_NAME}" "${{ github.repository }}" out
      - name: Push to tap
        env:
          DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${DEPLOY_KEY}" ]; then
            echo "::error::HOMEBREW_TAP_DEPLOY_KEY is not configured; the tap was not updated"
            exit 1
          fi
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          ssh-keyscan github.com >> ~/.ssh/known_hosts 2>/dev/null
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o IdentitiesOnly=yes"
          git clone git@github.com:marcomq/homebrew-tap.git tap
          mkdir -p tap/Formula
          cp out/Formula/mq-bridge-connect.rb tap/Formula/mq-bridge-connect.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/mq-bridge-connect.rb
          if git diff --cached --quiet; then
            echo "tap already up to date for ${GITHUB_REF_NAME}"
            exit 0
          fi
          git commit -m "mq-bridge-connect ${GITHUB_REF_NAME}"
          git push

  # The crate compiles only the Rust side; its build script fetches the Go
  # library from this release's archive, checked against the pins written here.
  publish-crate:
    name: Publish crate
    needs: publish
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: artifacts
          merge-multiple: true
      - name: Pin the archive checksums
        run: python3 scripts/pin_checksums.py "${GITHUB_REF_NAME}" artifacts

      # Builds the packaged crate, so it also proves the release download works.
      - name: Verify crate package
        run: cargo package --locked --allow-dirty

      - uses: actions/upload-artifact@v4
        with:
          name: crate-package
          path: target/package/*.crate
          if-no-files-found: error

      # Until a trusted publisher exists (first release), the auth step fails
      # and a CARGO_REGISTRY_TOKEN secret, if set, is used instead.
      - name: Authenticate to crates.io
        id: auth
        continue-on-error: true
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --locked --allow-dirty

  # The npm package holds no libraries (too large for the registry); it
  # downloads this release's archive and checks it against the pins below, so
  # it is published only once the release assets exist.
  publish-npm:
    name: Publish npm package
    needs: publish
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: https://registry.npmjs.org
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.5.1
      - uses: actions/download-artifact@v4
        with:
          pattern: standalone-*
          path: artifacts
          merge-multiple: true

      - name: Pin the archive checksums
        run: python3 scripts/pin_checksums.py "${GITHUB_REF_NAME}" artifacts

      - name: Create npm tarball
        working-directory: node
        run: |
          cp ../LICENSE-MIT ../LICENSE-APACHE .
          mkdir -p ../dist
          npm pack --pack-destination ../dist
          tar tzf ../dist/*.tgz | grep -qx package/checksums.json

      # Uploaded before publishing: if the registry refuses, e.g. on the first
      # release before a trusted publisher exists, publish this file by hand.
      - uses: actions/upload-artifact@v4
        with:
          name: npm-tarball
          path: dist/*.tgz
          if-no-files-found: error

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish ./dist/*.tgz --access public

  conda:
    name: Conda ${{ matrix.target }} package
    needs: publish
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: linux-64
            runner: ubuntu-latest
            artifact: standalone-x86_64-unknown-linux-gnu
          - target: linux-aarch64
            runner: ubuntu-24.04-arm
            artifact: standalone-aarch64-unknown-linux-gnu
          - target: osx-arm64
            runner: macos-latest
            artifact: standalone-aarch64-apple-darwin
          - target: win-64
            runner: windows-latest
            artifact: standalone-x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - name: Download the standalone archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: release-dist

      # The recipe compiles nothing; it installs these files, notices included.
      # Each package is built on its own platform's runner so the recipe's
      # `if: win` branch runs on the host it was written for.
      - name: Stage the libraries for the recipe
        run: |
          set -euo pipefail
          mkdir -p packaging/conda/stage
          tar xzf release-dist/mq-bridge-connect-*.tar.gz \
            -C packaging/conda/stage --strip-components=1
          echo "MQ_BRIDGE_PLUGIN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Build the conda package
        uses: prefix-dev/rattler-build-action@1ca5f45832f419a46d1326ccc5861d7e14d67c44 # v0.2.39
        with:
          recipe-path: packaging/conda/recipe.yaml
          build-args: --target-platform=${{ matrix.target }} -c conda-forge
          artifact-name: conda-${{ matrix.target }}

  publish-conda:
    name: Publish conda packages
    needs: conda
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Download conda packages
        uses: actions/download-artifact@v4
        with:
          pattern: conda-*
          path: conda-packages
          merge-multiple: true

      # A missing token fails the job instead of warning: a release that
      # quietly publishes nothing is the worse outcome.
      - name: Upload to Anaconda.org
        env:
          ANACONDA_API_TOKEN: ${{ secrets.ANACONDA_API_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${ANACONDA_API_TOKEN}" ]; then
            echo "::error::ANACONDA_API_TOKEN is not configured; nothing was published"
            exit 1
          fi
          mapfile -t packages < <(find conda-packages -type f -name '*.conda' | sort)
          if [ "${#packages[@]}" -eq 0 ]; then
            echo "::error::no conda packages were produced"
            exit 1
          fi
          pipx install --include-deps anaconda-client
          anaconda upload --user marcomq --label main "${packages[@]}"
