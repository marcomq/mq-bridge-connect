# No input reads a hash: `generate` names the keys and the `redis` processor
# fetches them. `fields` rather than `walk_json_object`, which cannot write a
# JSON number.
[cases.redis_hash]
broker = "redis"
order = "output_first"
template = '''
output:
  redis_hash:
    url: tcp://localhost:$PORT
    key: key-$ID-${! json("id") }
    fields:
      id: ${! json("id") }
      run: ${! json("run") }

input:
  generate:
    count: 10
    interval: ""
    mapping: root = counter()
  processors:
    - redis:
        url: tcp://localhost:$PORT
        command: hgetall
        args_mapping: root = [ "key-$ID-%v".format(this) ]
    - mutation: root.id = this.id.number()
'''

# upstream: azure/integration_test.go, against Azurite, whose account key is
# the published development one.
[cases.azure_blob_storage]
broker = "azurite_blob"
order = "output_first"
template = '''
output:
  azure_blob_storage:
    blob_type: BLOCK
    container: c-$ID
    max_in_flight: 1
    path: test/${!counter()}.txt
    public_access_level: PRIVATE
