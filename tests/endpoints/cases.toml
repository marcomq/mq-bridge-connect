[cases.mongodb]
broker = "mongodb"
order = "output_first"
template = '''
output:
  mongodb:
    url: mongodb://localhost:$PORT
    database: test
    collection: c$ID
    operation: insert-one
    document_map: root = this

input:
  mongodb:
    url: mongodb://localhost:$PORT
