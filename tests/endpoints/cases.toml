'''

# The `cache` output into Redis, read back by scanning its keys.
[cases.redis_scan]
broker = "redis"
order = "output_first"
template = '''
output:
  cache:
    target: redis
    key: key-$ID-${! json("id") }

cache_resources:
  - label: redis
    redis:
      url: tcp://localhost:$PORT

input:
  redis_scan:
    url: tcp://localhost:$PORT
    match: key-$ID-*
  processors:
    - mapping: root = this.value.parse_json()
'''

[cases.postgres_raw]
broker = "postgres"
order = "output_first"
template = '''
output:
  sql_raw:
    driver: postgres
    dsn: postgres://testuser:testpass@localhost:$PORT/testdb?sslmode=disable
    query: INSERT INTO r$ID (id, run) VALUES ($1, $2);
    args_mapping: root = [ this.id, this.run ]
    init_statement: CREATE TABLE IF NOT EXISTS r$ID (id INTEGER, run TEXT);

input:
  sql_raw:
    driver: postgres
    dsn: postgres://testuser:testpass@localhost:$PORT/testdb?sslmode=disable
    query: SELECT id, run FROM r$ID;
'''

# upstream: sftp/integration_test.go
[cases.sftp]
broker = "sftp"
order = "output_first"
template = '''
output:
  sftp:
    address: localhost:$PORT
    path: /upload/test-$ID/${! json("id") }.txt
    credentials:
      username: foo
      password: pass
      host_public_key: $HOST_KEY
    codec: all-bytes
    max_in_flight: 1

input:
  sftp:
    address: localhost:$PORT
    paths:
      - /upload/test-$ID/*.txt
    credentials:
      username: foo
      password: pass
      host_public_key: $HOST_KEY
