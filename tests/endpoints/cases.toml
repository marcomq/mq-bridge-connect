# Connector round trips for tests/endpoints/run.py.
#
# A case is a Redpanda Connect stream template: the runner publishes through
# its `output:` block and reads back through its `input:` block. Templates
# marked `upstream` are copied from the integration test of that name under
# github.com/redpanda-data/connect/v4/internal/impl/, and take the same
# placeholders: $PORT, $ID, $MAX_IN_FLIGHT, $OUTPUT_BATCH_COUNT,
# $OUTPUT_META_EXCLUDE_PREFIX and $VARn (set with `vars`). $DIR is a scratch
# directory of the case.
#
# Case keys: broker, template, setup (a template run to completion first, for
# what the connectors do not create), vars, env, count (10), timeout (30),
# settle (1.5, seconds between starting the input and publishing),
# order = "output_first", metadata = true, xfail = "why", stdio = true (the
# publishing process's stdout becomes the reading one's stdin).
# Broker keys: image, port, args, env, ready_log, ready_timeout (60),
# exec (a local binary used instead of the image when it is on PATH),
# capture ({ NAME = command } run in the container; its output becomes $NAME).
# ports ({ NAME = port }, further container ports; the mapped one becomes $NAME).
#
# A [middlewares.*] case needs no broker: `input` lines go through a native
# file-to-file route carrying `middlewares`, and what arrives is compared with
# `expect` (unordered; JSON compared by value). `error` instead expects the
# batch to be rejected with a message containing it. $HTTP is the port of a
# server that answers a POST with its body uppercased; $DIR is a scratch
# directory, $FIXTURES the `fixtures` directory next to this file.

# ---------------------------------------------------------------- brokers

[brokers.beanstalkd]
# The image publishes only `latest`, so it is pinned by digest.
image = "schickling/beanstalkd@sha256:19a928e3563973219e44f6c29df2a71103c7db894692ae94b7d0760837877e73"
port = 11300
exec = ["beanstalkd", "-l", "127.0.0.1", "-p", "$PORT"]

[brokers.redis]
image = "redis:7-alpine"
port = 6379
exec = ["redis-server", "--port", "$PORT", "--save", ""]

[brokers.nats]
image = "nats:2.10-alpine"
port = 4222
args = ["--js"]
exec = ["nats-server", "--js", "-a", "127.0.0.1", "-p", "$PORT"]

[brokers.rabbitmq]
image = "rabbitmq:4.1-alpine"
port = 5672
ready_log = "Server startup complete"
ready_timeout = 120

[brokers.mosquitto]
image = "eclipse-mosquitto:2.0"
port = 1883
args = ["mosquitto", "-c", "/mosquitto-no-auth.conf"]

[brokers.nsq]
image = "nsqio/nsq:v1.2.1"
port = 4150
args = ["/nsqd"]

[brokers.pulsar]
image = "apachepulsar/pulsar:3.3.4"
port = 6650
args = ["bin/pulsar", "standalone"]
# The default 2 GiB heap does not fit a small Docker VM.
env = { PULSAR_MEM = "-Xms256m -Xmx512m -XX:MaxDirectMemorySize=256m" }
ready_log = "messaging service is ready"
ready_timeout = 180

[brokers.mongodb]
image = "mongo:7"
port = 27017

[brokers.postgres]
image = "postgres:16-alpine"
port = 5432
env = { POSTGRES_USER = "testuser", POSTGRES_PASSWORD = "testpass", POSTGRES_DB = "testdb" }
ready_log = "ready to accept connections(.|\\n)*ready to accept connections"

[brokers.sftp]
image = "atmoz/sftp:alpine"
port = 22
args = ["foo:pass:1001:100:upload"]
ready_log = "Server listening on"
capture = { HOST_KEY = ["cat", "/etc/ssh/ssh_host_ed25519_key.pub"] }

# Azurite, one service per container: a broker has one port.
[brokers.azurite_blob]
image = "mcr.microsoft.com/azure-storage/azurite:3.34.0"
port = 10000
args = ["azurite-blob", "--blobHost", "0.0.0.0", "--skipApiVersionCheck"]

[brokers.azurite_queue]
image = "mcr.microsoft.com/azure-storage/azurite:3.34.0"
port = 10001
args = ["azurite-queue", "--queueHost", "0.0.0.0", "--skipApiVersionCheck"]

[brokers.azurite_table]
image = "mcr.microsoft.com/azure-storage/azurite:3.34.0"
port = 10002
args = ["azurite-table", "--tableHost", "0.0.0.0", "--skipApiVersionCheck"]

[brokers.nats_streaming]
image = "nats-streaming:0.25.6"
port = 4222

[brokers.fake_gcs]
image = "fsouza/fake-gcs-server:1.52.2"
port = 4443
args = ["-scheme", "http", "-public-host", "localhost"]

# Creates the topic `blobfish` in project `benthos` on start.
[brokers.pubsub]
# The image publishes only `latest`, so it is pinned by digest.
image = "thekevjames/gcloud-pubsub-emulator@sha256:f6480c7380649314faaad79a0fb24c4311ee5ae52442d3100b9e75b7c180c241"
port = 8681
env = { PUBSUB_PROJECT1 = "benthos,blobfish" }
ready_log = "Server started, listening on 8681"
ready_timeout = 120

# `capture` is used for its side effect: the keyspace and table the case needs.
[brokers.cassandra]
image = "cassandra:5.0"
port = 9042
env = { MAX_HEAP_SIZE = "512M", HEAP_NEWSIZE = "100M" }
ready_log = "Starting listening for CQL clients"
ready_timeout = 240
capture = { INIT = ["cqlsh", "-e", "CREATE KEYSPACE testspace WITH replication = {'class':'SimpleStrategy','replication_factor':1}; CREATE TABLE testspace.messages (id int primary key, run text);"] }

# The output speaks gRPC; the case reads back over REST.
[brokers.qdrant]
image = "qdrant/qdrant:v1.17.0"
port = 6334
ports = { REST = 6333 }

[brokers.questdb]
image = "questdb/questdb:8.0.0"
port = 9000
env = { JAVA_OPTS = "-Xms512m -Xmx512m" }
ready_timeout = 180

# `capture` is used for its side effect: rangefeeds on, and the table.
[brokers.cockroach]
image = "cockroachdb/cockroach:v24.3.5"
port = 26257
args = ["start-single-node", "--insecure"]
ready_log = "CockroachDB node starting"
ready_timeout = 120
capture = { INIT = ["cockroach", "sql", "--insecure", "-e", "SET CLUSTER SETTING kv.rangefeed.enabled = true", "-e", "CREATE TABLE messages (id INT PRIMARY KEY, run STRING)"] }

# ------------------------------------------------- no broker: run anywhere

[cases.file]
order = "output_first"
template = '''
output:
  file:
    path: $DIR/data.jsonl
    codec: lines

input:
  file:
    paths: [ $DIR/data.jsonl ]
    scanner:
      lines: {}
'''

[cases.socket]
template = '''
output:
  socket:
    network: tcp
    address: 127.0.0.1:$PORT

input:
  socket_server:
    network: tcp
    address: 127.0.0.1:$PORT
'''

[cases.http]
template = '''
output:
  http_client:
    url: http://127.0.0.1:$PORT/post
    verb: POST

input:
  http_server:
    address: 127.0.0.1:$PORT
    path: /post
'''

[cases.sqlite]
order = "output_first"
template = '''
output:
  sql_insert:
    driver: sqlite
    dsn: file:$DIR/test.db
    table: messages
    columns: [ id, run ]
    args_mapping: root = [ this.id, this.run ]
    init_statement: CREATE TABLE IF NOT EXISTS messages (id INTEGER, run TEXT);

input:
  sql_select:
    driver: sqlite
    dsn: file:$DIR/test.db
    table: messages
    columns: [ id, run ]
'''

# upstream: nanomsg/integration_test.go, with `bind` swapped: the publishing
# `mqb copy` exits once drained, so the side that stays up has to listen.
[cases.nanomsg]
vars = { VAR1 = "PUSH", VAR2 = "PULL", VAR3 = "" }
template = '''
output:
  nanomsg:
    urls:
      - tcp://127.0.0.1:$PORT
    bind: false
    socket_type: $VAR1
    poll_timeout: 5s
    max_in_flight: $MAX_IN_FLIGHT

input:
  nanomsg:
    urls:
      - tcp://127.0.0.1:$PORT
    bind: true
    socket_type: $VAR2
    sub_filters: [ $VAR3 ]
'''

[cases.subprocess]
order = "output_first"
template = '''
output:
  subprocess:
    name: sh
    args: [ -c, "cat >> $DIR/data.jsonl" ]
    codec: lines

input:
  subprocess:
    name: cat
    args: [ $DIR/data.jsonl ]
    codec: lines
'''

[cases.websocket]
template = '''
output:
  websocket:
    url: ws://127.0.0.1:$PORT/ws

input:
  http_server:
    address: 127.0.0.1:$PORT
    path: /post
    ws_path: /ws
'''

[cases.csv]
order = "output_first"
template = '''
output:
  file:
    path: $DIR/data.csv
    codec: lines
  processors:
    - mapping: |
        root = "%v,%v".format(this.id, this.run)

input:
  csv:
    paths: [ $DIR/data.csv ]
    parse_header_row: false
  processors:
    - mapping: |
        root = {"id": this.index(0).number(), "run": this.index(1)}
'''

[cases.sql_raw]
order = "output_first"
template = '''
output:
  sql_raw:
    driver: sqlite
    dsn: file:$DIR/test.db
    query: INSERT INTO messages (id, run) VALUES (?, ?);
    args_mapping: root = [ this.id, this.run ]
    init_statement: CREATE TABLE IF NOT EXISTS messages (id INTEGER, run TEXT);

input:
  sql_raw:
    driver: sqlite
    dsn: file:$DIR/test.db
    query: SELECT id, run FROM messages;
'''

# The wrappers: components that take another component as their child.
[cases.broker]
order = "output_first"
template = '''
output:
  broker:
    pattern: fan_out
    outputs:
      - file:
          path: $DIR/data.jsonl
          codec: lines

input:
  broker:
    inputs:
      - file:
          paths: [ $DIR/data.jsonl ]
          scanner:
            lines: {}
'''

# The first output has nothing to connect to, so every message falls through.
[cases.fallback_sequence]
order = "output_first"
template = '''
output:
  fallback:
    - http_client:
        url: http://127.0.0.1:$PORT/nothing-listens-here
        retries: 0
    - file:
        path: $DIR/data.jsonl
        codec: lines

input:
  sequence:
    inputs:
      - file:
          paths: [ $DIR/data.jsonl ]
          scanner:
            lines: {}
'''

