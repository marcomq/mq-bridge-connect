[cases.beanstalkd]
broker = "beanstalkd"
template = '''
output:
  beanstalkd:
    address: 127.0.0.1:$PORT
    max_in_flight: $MAX_IN_FLIGHT

input:
  beanstalkd:
    address: 127.0.0.1:$PORT
'''

# upstream: redis/integration_test.go
[cases.redis_streams]
broker = "redis"
metadata = true
template = '''
output:
  redis_streams:
    url: tcp://localhost:$PORT
    stream: stream-$ID
    body_key: body
    max_length: 0
    max_in_flight: $MAX_IN_FLIGHT
