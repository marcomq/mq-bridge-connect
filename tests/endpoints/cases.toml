[cases.postgres]
broker = "postgres"
order = "output_first"
template = '''
output:
  sql_insert:
    driver: postgres
    dsn: postgres://testuser:testpass@localhost:$PORT/testdb?sslmode=disable
    table: m$ID
    columns: [ id, run ]
