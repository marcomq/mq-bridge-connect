input:
  redis_streams:
    url: tcp://localhost:$PORT
    body_key: body
    streams: [ stream-$ID ]
    limit: 10
    client_id: client-input-$ID
    consumer_group: group-$ID
'''

# upstream: redis/integration_test.go
[cases.redis_pubsub]
broker = "redis"
template = '''
output:
  redis_pubsub:
    url: tcp://localhost:$PORT
    channel: channel-$ID
    max_in_flight: $MAX_IN_FLIGHT

input:
  redis_pubsub:
    url: tcp://localhost:$PORT
    channels: [ channel-$ID ]
'''

# upstream: redis/integration_test.go
[cases.redis_list]
broker = "redis"
template = '''
output:
  redis_list:
    url: tcp://localhost:$PORT
    key: key-$ID
    max_in_flight: $MAX_IN_FLIGHT

input:
  redis_list:
    url: tcp://localhost:$PORT
    key: key-$ID
'''

# upstream: nats/integration_nats_test.go
[cases.nats]
broker = "nats"
template = '''
output:
  nats:
    urls: [ tcp://localhost:$PORT ]
    subject: subject-$ID
    max_in_flight: $MAX_IN_FLIGHT

input:
  nats:
    urls: [ tcp://localhost:$PORT ]
    queue: queue-$ID
    subject: subject-$ID
    prefetch_count: 1048
'''

# upstream: nats/integration_jetstream_test.go, which creates the stream with
# the NATS client; here the input does.
[cases.nats_jetstream]
broker = "nats"
template = '''
output:
  nats_jetstream:
    urls: [ nats://localhost:$PORT ]
    subject: subject-$ID

input:
  nats_jetstream:
    urls: [ nats://localhost:$PORT ]
    subject: subject-$ID
    durable: durable-$ID
    stream: stream-$ID
    create_stream: true
'''

# upstream: nats/integration_kv_test.go, which creates the bucket with the NATS
# client. A bucket is a stream named `KV_<bucket>`, so the setup asks for one.
[cases.nats_kv]
broker = "nats"
setup = '''
input:
  generate:
    count: 1
    interval: ""
    mapping: |
      root = {
        "name": "KV_bucket-$ID", "subjects": ["$KV.bucket-$ID.>"],
        "max_msgs_per_subject": 1, "discard": "new", "storage": "memory",
        "allow_rollup_hdrs": true, "deny_delete": true, "allow_direct": true,
        "retention": "limits", "num_replicas": 1
      }

output:
  nats:
    urls: [ tcp://localhost:$PORT ]
    subject: $JS.API.STREAM.CREATE.KV_bucket-$ID
'''
template = '''
output:
  label: kv_output
  nats_kv:
    urls: [ tcp://localhost:$PORT ]
    bucket: bucket-$ID
    key: ${! ksuid() }

input:
  label: kv_input
  nats_kv:
    urls: [ tcp://localhost:$PORT ]
    bucket: bucket-$ID
'''

# upstream: amqp09/integration_test.go, through the default exchange: upstream
# opens the output (which declares the exchange) before the input binds to it
# and only then publishes, an order two `mqb copy` processes cannot keep.
[cases.amqp_0_9]
broker = "rabbitmq"
metadata = true
vars = { VAR1 = "false" }
template = '''
output:
  amqp_0_9:
    urls:
      - amqp://guest:guest@localhost:1234/
      - amqp://guest:guest@localhost:$PORT/ # fallback URL
      - amqp://guest:guest@localhost:4567/
    max_in_flight: $MAX_IN_FLIGHT
    exchange: ""
    key: queue-$ID
    metadata:
      exclude_prefixes: [ $OUTPUT_META_EXCLUDE_PREFIX ]

input:
  amqp_0_9:
    urls:
      - amqp://guest:guest@localhost:1234/
      - amqp://guest:guest@localhost:$PORT/ # fallback URL
      - amqp://guest:guest@localhost:4567/
    auto_ack: $VAR1
    queue: queue-$ID
    queue_declare:
      durable: true
      enabled: true
'''

# upstream: amqp1/integration_test.go, against RabbitMQ 4 rather than ActiveMQ.
# Its AMQP 1.0 addresses are `/queues/<name>` and the queue has to exist, which
# the setup arranges over AMQP 0.9; it rejects annotation keys without an `x-`
# prefix, hence the metadata exclusion.
[cases.amqp_1]
broker = "rabbitmq"
setup = '''
input:
  amqp_0_9:
    urls: [ amqp://guest:guest@localhost:$PORT/ ]
    queue: queue-$ID
    queue_declare:
      durable: true
      enabled: true

output:
  drop: {}
'''
template = '''
output:
  amqp_1:
    url: amqp://guest:guest@localhost:$PORT/
    target_address: "/queues/queue-$ID"
    max_in_flight: $MAX_IN_FLIGHT
    metadata:
      exclude_prefixes: [ "" ]

input:
  amqp_1:
    url: amqp://guest:guest@localhost:$PORT/
    source_address: "/queues/queue-$ID"
'''

# upstream: mqtt/integration_test.go
