# upstream: qdrant/integration_test.go, read back by scrolling the collection.
# 127.0.0.1, as the gRPC client hangs on `localhost` when only IPv4 is mapped;
# the payload is rebuilt because the output cannot coerce a JSON number.
[cases.qdrant]
broker = "qdrant"
order = "output_first"
setup = '''
input:
  generate:
    count: 1
    interval: ""
    mapping: |
      root = {"vectors": {"size": 3, "distance": "Cosine"}}

output:
  http_client:
    url: http://localhost:$REST/collections/c$ID
    verb: PUT
    headers:
      Content-Type: application/json
'''
template = '''
output:
  qdrant:
    grpc_host: 127.0.0.1:$PORT
    tls: {enabled: false}
    id: root = json("id")
    collection_name: c$ID
    vector_mapping: root = [0.352, 0.532, 0.532]
    payload_mapping: 'root = {"id": this.id.number().round(), "run": this.run}'

input:
  http_client:
    url: http://localhost:$REST/collections/c$ID/points/scroll
    verb: POST
    headers:
      Content-Type: application/json
    payload: '{"limit": 100, "with_payload": true}'
  processors:
    - mapping: root = this.result.points.map_each(p -> p.payload)
    - unarchive:
        format: json_array
'''

# upstream: questdb/integration_test.go, read back with a query over HTTP.
[cases.questdb]
broker = "questdb"
order = "output_first"
template = '''
output:
  questdb:
    address: localhost:$PORT
    table: t$ID

input:
  http_client:
    url: http://localhost:$PORT/exec?query=select%20id%2C%20run%20from%20t$ID
    verb: GET
  processors:
    - mapping: |
        root = this.dataset.map_each(r -> {"id": r.index(0), "run": r.index(1)})
    - unarchive:
        format: json_array
'''

# The rows are written with `sql_raw`; the changefeed starts with a scan of them.
[cases.cockroachdb_changefeed]
broker = "cockroach"
order = "output_first"
template = '''
output:
  sql_raw:
    driver: postgres
    dsn: postgres://root@localhost:$PORT/defaultdb?sslmode=disable
    query: INSERT INTO messages (id, run) VALUES ($1, $2);
    args_mapping: root = [ this.id, this.run ]

input:
  cockroachdb_changefeed:
    dsn: postgres://root@localhost:$PORT/defaultdb?sslmode=disable
    tables:
      - messages
  processors:
    - mapping: root = this.row.parse_json().after
'''

# ------------------------------------------- processors as middlewares

[middlewares.connect_mapping]
input = ['{"id":1,"name":"a"}', '{"id":2,"name":"drop"}']
middlewares = [{ connect_mapping = 'root = if this.name == "drop" { deleted() } else { this.merge({"seen": true}) }' }]
expect = ['{"id":1,"name":"a","seen":true}']

[middlewares.connect_mapping_throw]
input = ['{"id":1}']
middlewares = [{ connect_mapping = 'root = throw("bad input")' }]
error = "bad input"

[middlewares.connect_mutation]
input = ['{"id":1,"name":"a"}']
middlewares = [{ connect_mutation = 'root.name = this.name.uppercase()' }]
expect = ['{"id":1,"name":"A"}']

[middlewares.connect_bloblang]
input = ['{"id":1,"name":"a"}']
middlewares = [{ connect_bloblang = 'root = this.name' }]
expect = ["a"]

[middlewares.connect_jq]
input = ['{"id":1,"name":"a"}']
middlewares = [{ connect_jq = { query = ".name" } }]
expect = ['"a"']

[middlewares.connect_jmespath]
input = ['{"id":1,"name":"a"}']
middlewares = [{ connect_jmespath = { query = "name" } }]
expect = ['"a"']

[middlewares.connect_grok]
input = ["GET 200"]
middlewares = [{ connect_grok = { expressions = ["%{WORD:verb} %{NUMBER:code}"] } }]
expect = ['{"verb":"GET","code":"200"}']

[middlewares.connect_parse_log]
input = ["<34>Oct 11 22:14:15 mymachine su: failed"]
middlewares = [
  # Listed first, applied last: the year of an RFC 3164 timestamp is a guess.
  { connect_mapping = 'root = this.without("timestamp")' },
  { connect_parse_log = { format = "syslog_rfc3164" } },
]
expect = ['{"appname":"su","facility":4,"hostname":"mymachine","message":"failed","priority":34,"severity":2}']

[middlewares.connect_json_schema]
input = ['{"id":1}']
middlewares = [{ connect_json_schema = { schema = '{"type":"object","required":["id"]}' } }]
expect = ['{"id":1}']

[middlewares.connect_json_schema_rejects]
input = ['{"id":1}']
middlewares = [{ connect_json_schema = { schema = '{"type":"object","required":["name"]}' } }]
error = "name is required"

# An input's middlewares apply last to first, so the encoder is listed second.
[middlewares.connect_msgpack]
input = ['{"id":1,"name":"a"}']
middlewares = [
  { connect_msgpack = { operator = "to_json" } },
  { connect_msgpack = { operator = "from_json" } },
]
expect = ['{"id":1,"name":"a"}']

[middlewares.connect_avro]
input = ['{"id":1,"name":"a"}']
middlewares = [
  { connect_avro = { operator = "to_json", schema = '{"type":"record","name":"r","fields":[{"name":"id","type":"long"},{"name":"name","type":"string"}]}' } },
  { connect_avro = { operator = "from_json", schema = '{"type":"record","name":"r","fields":[{"name":"id","type":"long"},{"name":"name","type":"string"}]}' } },
]
expect = ['{"id":1,"name":"a"}']

[middlewares.connect_javascript]
input = ["a"]
middlewares = [{ connect_javascript = { code = "benthos.v0_msg_set_string(benthos.v0_msg_as_string() + '!');" } }]
expect = ["a!"]

[middlewares.connect_branch]
input = ['{"id":1,"name":"a"}']
middlewares = [{ connect_branch = { request_map = "root = this.name", processors = [{ mapping = "root = content().uppercase()" }], result_map = "root.upper = content().string()" } }]
expect = ['{"id":1,"name":"a","upper":"A"}']

# The second message has the first one's key, so it gets the cached result.
[middlewares.connect_cached]
input = ['{"id":1,"name":"a"}', '{"id":1,"name":"b"}', '{"id":2,"name":"c"}']
middlewares = [{ connect_cached = { cache = { memory = {} }, key = '${! json("id") }', processors = [{ mapping = "root = this.name" }] } }]
expect = ["a", "a", "c"]

[middlewares.connect_dedupe]
input = ['{"id":1,"name":"a"}', '{"id":1,"name":"again"}', '{"id":2,"name":"b"}']
middlewares = [{ connect_dedupe = { key = '${! json("id") }', cache = { memory = {} } } }]
expect = ['{"id":1,"name":"a"}', '{"id":2,"name":"b"}']

[middlewares.connect_log]
input = ['{"id":1}']
middlewares = [{ connect_log = { message = 'seen ${! json("id") }' } }]
expect = ['{"id":1}']

[middlewares.connect_http]
input = ["hello"]
middlewares = [{ connect_http = { url = "http://127.0.0.1:$HTTP/", verb = "POST" } }]
expect = ["HELLO"]

# The chain: any processor, several per call, sharing a resource by label.
[middlewares.connect]
input = ['{"id":1,"name":"a"}', '{"id":1,"name":"again"}']
expect = ["a"]
[[middlewares.connect.middlewares]]
[middlewares.connect.middlewares.connect]
processors = [
  { dedupe = { cache = "seen", key = '${! json("id") }' } },
  { msgpack = { operator = "from_json" } },
  { msgpack = { operator = "to_json" } },
  { mapping = "root = this.name" },
]
cache_resources = [{ label = "seen", memory = { default_ttl = "5m" } }]

# A processor that splits a message cannot be a middleware.
[middlewares.connect_rejects_fan_out]
input = ["one"]
middlewares = [{ connect = { processors = [{ mapping = 'root = "one\ntwo"' }, { unarchive = { format = "lines" } }] } }]
error = "pipeline"

# Listed decoder first: an input's middlewares apply last to first.
[middlewares.connect_schema_registry]
input = ['{"id":1,"name":"a"}']
middlewares = [
  { connect_schema_registry_decode = { url = "http://127.0.0.1:$HTTP" } },
  { connect_schema_registry_encode = { url = "http://127.0.0.1:$HTTP", subject = "s" } },
]
expect = ['{"id":1,"name":"a"}']

# ---------------------------- other processors, through the `connect` chain

[middlewares.processor_compress]
input = ["hello"]
middlewares = [{ connect = { processors = [{ compress = { algorithm = "gzip" } }, { decompress = { algorithm = "gzip" } }] } }]
expect = ["hello"]

[middlewares.processor_bounds_check]
input = ["ab", "abcd"]
middlewares = [{ connect = { processors = [{ bounds_check = { min_part_size = 3 } }] } }]
expect = ["abcd"]

[middlewares.processor_try_catch]
input = ["a"]
middlewares = [{ connect = { processors = [
  { try = [{ mapping = 'root = throw("no")' }, { mapping = 'root = "skipped"' }] },
  { catch = [{ mapping = 'root = "caught"' }] },
] } }]
expect = ["caught"]

[middlewares.processor_switch]
input = ['{"id":1}', '{"id":2}']
middlewares = [{ connect = { processors = [{ switch = [
  { check = "this.id == 1", processors = [{ mutation = 'root.kind = "one"' }] },
  { processors = [{ mutation = 'root.kind = "other"' }] },
] }] } }]
expect = ['{"id":1,"kind":"one"}', '{"id":2,"kind":"other"}']

[middlewares.processor_for_each]
input = ["a"]
middlewares = [{ connect = { processors = [{ for_each = [{ mapping = "root = content().uppercase()" }] }] } }]
expect = ["A"]

[middlewares.processor_while]
input = ['{"n":0}']
middlewares = [{ connect = { processors = [{ while = { check = "this.n < 3", processors = [{ mapping = "root.n = this.n + 1" }] } }] } }]
expect = ['{"n":3}']

[middlewares.processor_retry]
input = ["a"]
middlewares = [{ connect = { processors = [{ retry = { max_retries = 1, processors = [{ mapping = "root = content().uppercase()" }] } }] } }]
expect = ["A"]

[middlewares.processor_parallel]
input = ["a"]
middlewares = [{ connect = { processors = [{ parallel = { processors = [{ mapping = "root = content().uppercase()" }] } }] } }]
expect = ["A"]

[middlewares.processor_processors]
input = ["a"]
middlewares = [{ connect = { processors = [{ processors = [{ noop = {} }, { sleep = { duration = "1ms" } }, { select_parts = { parts = [0] } }, { mapping = "root = content().uppercase()" }] }] } }]
expect = ["A"]

[middlewares.processor_workflow]
input = ['{"id":1}']
middlewares = [{ connect = { processors = [{ workflow = { meta_path = "", branches = { double = { request_map = "root = this.id", processors = [{ mapping = "root = this * 2" }], result_map = "root.double = this" } } } }] } }]
expect = ['{"id":1,"double":2}']

[middlewares.processor_cache]
input = ["a"]
expect = ["a"]
[[middlewares.processor_cache.middlewares]]
[middlewares.processor_cache.middlewares.connect]
processors = [
  { cache = { resource = "c", operator = "set", key = "k", value = "${! content() }" } },
  { mapping = 'root = "gone"' },
  { cache = { resource = "c", operator = "get", key = "k" } },
]
cache_resources = [{ label = "c", memory = {} }]

[middlewares.processor_rate_limit]
input = ["a", "b"]
expect = ["a", "b"]
[[middlewares.processor_rate_limit.middlewares]]
[middlewares.processor_rate_limit.middlewares.connect]
processors = [{ rate_limit = { resource = "r" } }]
rate_limit_resources = [{ label = "r", local = { count = 100, interval = "1s" } }]

[middlewares.processor_metric]
input = ["a"]
middlewares = [{ connect = { processors = [{ metric = { type = "counter", name = "seen" } }] } }]
expect = ["a"]

[middlewares.processor_command]
input = ["a"]
middlewares = [{ connect = { processors = [{ command = { name = "tr", args_mapping = '["a-z", "A-Z"]' } }] } }]
expect = ["A"]

[middlewares.processor_subprocess]
input = ["a"]
middlewares = [{ connect = { processors = [{ subprocess = { name = "cat" } }] } }]
expect = ["a"]

[middlewares.processor_sql]
input = ['{"id":1,"name":"a"}']
middlewares = [{ connect = { processors = [
  { sql_raw = { driver = "sqlite", dsn = "file:$DIR/p.db", query = "INSERT INTO t (id, name) VALUES (?, ?)", args_mapping = "root = [ this.id, this.name ]", exec_only = true, init_statement = "CREATE TABLE t (id INTEGER, name TEXT);" } },
  { sql_insert = { driver = "sqlite", dsn = "file:$DIR/p.db", table = "t", columns = ["id", "name"], args_mapping = 'root = [ 2, "b" ]' } },
  { sql_select = { driver = "sqlite", dsn = "file:$DIR/p.db", table = "t", columns = ["name"], suffix = "ORDER BY id" } },
] } }]
expect = ['[{"name":"a"},{"name":"b"}]']

[middlewares.processor_try_catch_block]
input = ["a"]
middlewares = [{ connect = { processors = [{ try_catch = { processors = [{ mapping = 'root = throw("no")' }], catch = [{ mapping = 'root = "caught"' }] } }] } }]
expect = ["caught"]

[middlewares.processor_string_split]
input = ["a,b"]
middlewares = [{ connect = { processors = [{ string_split = { delimiter = "," } }] } }]
expect = ['["a","b"]']

[middlewares.processor_text_chunker]
input = ["hello"]
middlewares = [{ connect = { processors = [{ text_chunker = { strategy = "recursive_character", chunk_size = 100, chunk_overlap = 0 } }] } }]
expect = ["hello"]

# Like `unarchive`: more messages out than in cannot be a middleware.
[middlewares.processor_text_chunker_rejects_fan_out]
input = ["hello world"]
middlewares = [{ connect = { processors = [{ text_chunker = { strategy = "recursive_character", chunk_size = 6, chunk_overlap = 0 } }] } }]
error = "pipeline"

# A batch of one: these reshape a batch, which a middleware must not.
[middlewares.processor_archive]
input = ['{"id":1}']
middlewares = [{ connect = { processors = [{ archive = { format = "json_array" } }] } }]
expect = ['[{"id":1}]']

[middlewares.processor_group_by]
input = ['{"id":1}']
middlewares = [{ connect = { processors = [{ group_by = [{ check = "this.id == 1", processors = [{ mutation = 'root.kind = "one"' }] }] }] } }]
expect = ['{"id":1,"kind":"one"}']

[middlewares.processor_group_by_value]
input = ["a"]
middlewares = [{ connect = { processors = [{ group_by_value = { value = "${! content() }" } }] } }]
expect = ["a"]

[middlewares.processor_insert_part_rejects_fan_out]
input = ["a"]
middlewares = [{ connect = { processors = [{ insert_part = { content = "b" } }] } }]
error = "pipeline"

[middlewares.processor_sync_response]
input = ["a"]
middlewares = [{ connect = { processors = [{ sync_response = {} }] } }]
expect = ["a"]

# The cache types that need no server, behind the `cache` processor.
[middlewares.processor_cache_lru]
input = ["a"]
expect = ["a"]
[[middlewares.processor_cache_lru.middlewares]]
[middlewares.processor_cache_lru.middlewares.connect]
processors = [
  { cache = { resource = "c", operator = "set", key = "k", value = "${! content() }" } },
  { mapping = 'root = "gone"' },
  { cache = { resource = "c", operator = "get", key = "k" } },
]
cache_resources = [{ label = "c", lru = {} }]

[middlewares.processor_cache_ttlru]
input = ["a"]
expect = ["a"]
[[middlewares.processor_cache_ttlru.middlewares]]
[middlewares.processor_cache_ttlru.middlewares.connect]
processors = [
  { cache = { resource = "c", operator = "set", key = "k", value = "${! content() }" } },
  { mapping = 'root = "gone"' },
  { cache = { resource = "c", operator = "get", key = "k" } },
]
cache_resources = [{ label = "c", ttlru = {} }]

[middlewares.processor_cache_ristretto]
input = ["a"]
expect = ["a"]
[[middlewares.processor_cache_ristretto.middlewares]]
[middlewares.processor_cache_ristretto.middlewares.connect]
processors = [
  { cache = { resource = "c", operator = "set", key = "k", value = "${! content() }" } },
  { mapping = 'root = "gone"' },
  { cache = { resource = "c", operator = "get", key = "k" } },
]
cache_resources = [{ label = "c", ristretto = {} }]

[middlewares.processor_cache_multilevel]
input = ["a"]
expect = ["a"]
[[middlewares.processor_cache_multilevel.middlewares]]
[middlewares.processor_cache_multilevel.middlewares.connect]
processors = [
  { cache = { resource = "c", operator = "set", key = "k", value = "${! content() }" } },
  { mapping = 'root = "gone"' },
  { cache = { resource = "c", operator = "get", key = "k" } },
]
cache_resources = [
  { label = "c", multilevel = ["hot", "cold"] },
  { label = "hot", memory = {} },
  { label = "cold", lru = {} },
]

# fixtures/upper.wat, compiled: reads the message and writes it back uppercased.
[middlewares.processor_wasm]
input = ["hello"]
middlewares = [{ connect = { processors = [{ wasm = { module_path = "$FIXTURES/upper.wasm" } }] } }]
expect = ["HELLO"]
