[cases.retry_batched]
order = "output_first"
template = '''
output:
  retry:
    output:
      file:
        path: $DIR/data.jsonl
        codec: lines

input:
  batched:
    policy:
      count: 5
      period: 1s
    child:
      file:
        paths: [ $DIR/data.jsonl ]
        scanner:
          lines: {}
'''

[cases.drop_on_read_until]
order = "output_first"
template = '''
output:
  drop_on:
    error: true
    output:
      file:
        path: $DIR/data.jsonl
        codec: lines

input:
  read_until:
    idle_timeout: 2s
    input:
      file:
        paths: [ $DIR/data.jsonl ]
        scanner:
          lines: {}
'''

# The output is the server here: it hands one message to each GET.
[cases.http_server_output]
template = '''
output:
  http_server:
    address: 127.0.0.1:$PORT
    path: /get

input:
  http_client:
    url: http://127.0.0.1:$PORT/get
    verb: GET
'''

[cases.websocket_input]
template = '''
output:
  http_server:
    address: 127.0.0.1:$PORT
    ws_path: /ws

input:
  websocket:
    url: ws://127.0.0.1:$PORT/ws
'''

[cases.dynamic]
order = "output_first"
template = '''
output:
  dynamic:
    outputs:
      a:
        file:
          path: $DIR/data.jsonl
          codec: lines

input:
  dynamic:
    inputs:
      a:
        file:
          paths: [ $DIR/data.jsonl ]
          scanner:
            lines: {}
'''

[cases.reject_errored]
order = "output_first"
template = '''
output:
  reject_errored:
    file:
      path: $DIR/data.jsonl
      codec: lines

input:
  file:
    paths: [ $DIR/data.jsonl ]
    scanner:
      lines: {}
'''

[cases.stdio]
order = "output_first"
stdio = true
template = '''
output:
  stdout:
    codec: lines

input:
  stdin:
    scanner:
